name: fogtype
services:
  https:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443/udp"
      - "443:443/tcp"
      - "127.0.0.1:2019:2019"
    volumes:
      - ./etc/caddy:/etc/caddy
      - ./srv:/srv
      - caddy_data:/data
      - caddy_config:/config
  gts:
    image: superseriousbusiness/gotosocial:0.22.3@sha256:3f36dcf14a4f2e5562122e4783117c48a219d67988f841181b5c2ecaa65d5581
    restart: unless-stopped
    env_file:
      - path: etc/gotosocial/.env
        required: false
    environment:
      GTS_HOST: fogtype.com
      GTS_DB_TYPE: sqlite
      GTS_DB_ADDRESS: /gotosocial/storage/sqlite.db
      GTS_TRUSTED_PROXIES: 172.30.0.0/24,fded:a56c:7a13::/64
    volumes:
      - /usr/share/zoneinfo/Asia/Tokyo:/etc/localtime:ro
      - ./etc/gotosocial:/etc/gotosocial
      - gotosocial_data:/gotosocial/storage
    command: "--config-path /etc/gotosocial/config.yaml"
  maddy:
    image: foxcpp/maddy:0.9.8@sha256:f2396d08bad7cc3e2ec76422530a6310644ac03d435093991150486a791b08a2
    restart: unless-stopped
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
    environment:
      MADDY_CONFIG: /etc/maddy/maddy.conf
      MADDY_HOSTNAME: fogtype.com
      MADDY_DOMAIN: fogtype.com
    volumes:
      - /etc/maddy:/etc/maddy
      - caddy_data:/var/lib/caddy/data:ro
      - maddy_data:/data
    entrypoint:
      - /bin/maddy
    command: run
  cocoon:
    image: ghcr.io/haileyok/cocoon:latest@sha256:03dbe591f9c5548384463f2d79102302cd27972583ffeffe963142152a1ad1f3
    restart: unless-stopped
    env_file: etc/cocoon/.env
    volumes:
      - cocoon_data:/data
  headscale:
    image: headscale/headscale:v0.29.8@sha256:f549a444481d7ab0ad8b506a7ee43cadb00001a20fbaec34b56f8ccb136735e0
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "127.0.0.1:9200:9200"
    env_file:
      - path: etc/headscale/.env
        required: false
    volumes:
      - ./etc/headscale:/etc/headscale
      - headscale_data:/var/lib/headscale
    command: serve
  pocketid:
    image: ghcr.io/pocket-id/pocket-id:v2.19.3@sha256:189e03bb73bb86d7108fe81cbe2237c408cff2176b14cd7a39cc12a2ee8b2762
    restart: unless-stopped
    env_file: etc/pocketid/.env
    environment:
      APP_URL: https://auth.fogtype.com
      TRUST_PROXY: 172.30.0.0/24,fded:a56c:7a13::/64
    volumes:
      - pocketid_data:/app/data
volumes:
  caddy_data:
  caddy_config:
  gotosocial_data:
  maddy_data:
  cocoon_data:
  headscale_data:
  pocketid_data:
networks:
  default:
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/24
        - subnet: fded:a56c:7a13::/64
